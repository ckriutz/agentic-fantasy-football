services:
  leaguefrontend:
    image: ghcr.io/ckriutz/leaguefrontend:2
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${LEAGUEFRONTEND_PORT:-3080}:80"
    environment:
      - API_BASE_URL=
      - VITE_API_BASE_URL=
      - YAHOO_API_BASE_URL=
      - VITE_YAHOO_API_BASE_URL=
      - VITE_BLOB_BASE_URL=
      - VITE_BLOB_CONTAINER_NAME=
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # LeagueAPI - Player data aggregation service
  leagueapi:
    image: ghcr.io/ckriutz/leagueapi:3
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${LEAGUEAPI_PORT:-8082}:8082"
    environment:
      # Database connection
      - DBConnectionString=
      - AZURE_STORAGE_CONNECTION_STRING=
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://192.168.40.159:3080
    networks:
      - leagueapi-net
    
    healthcheck:
      # Image has no curl/wget; bash /dev/tcp is available
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  fantasyprosdatasync:
    image: ghcr.io/ckriutz/fantasyprosdatasync:1
    pull_policy: always
    restart: unless-stopped
    environment:
      - FANTASY_PROS_API_KEY=
      - AZURE_STORAGE_CONNECTION_STRING=
      - FANTASYPROS_STORAGE_CONTAINER_NAME=playerdata
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sportsdataiodatasync:
    image: ghcr.io/ckriutz/sportsdataiodatasync:1
    pull_policy: always
    restart: unless-stopped
    environment:
      - SPORTSDATA_API_KEY=
      - AZURE_STORAGE_CONNECTION_STRING=
      - SPORTSDATA_STORAGE_CONTAINER_NAME=playerdata
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sleepersync:
    image: ghcr.io/ckriutz/sleepersync:1
    pull_policy: always
    restart: unless-stopped
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=
      - SLEEPER_STORAGE_CONTAINER_NAME=playerdata
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  # YahooDataSync must remain single-replica because Yahoo rotates refresh tokens.
  yahoodatasync:
    image: ghcr.io/ckriutz/yahoodatasync:4
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${YAHOODATASYNC_PORT:-8003}:8003"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://192.168.40.159:3000
      - ASPNETCORE_URLS=http://+:8003
      - YAHOO_CLIENT_ID=
      - YAHOO_CLIENT_SECRET=
      - YahooClientId=
      - YahooClientSecret=
      - YAHOO_REDIRECT_URI=
      - AZURE_STORAGE_CONNECTION_STRING=
      - YAHOO_STORAGE_CONTAINER_NAME=yahoodata
      - YAHOO_OAUTH_STATE_BLOB_NAME=/private/oauth-state.json
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
      - YahooSync__Enabled=true
      - YahooSync__RunOnStartup=false
      - YahooSync__PageSize=${YAHOO_SYNC_PAGE_SIZE:-25}
      - YahooSync__DailySyncHourUtc=${YAHOO_SYNC_HOUR_UTC:-6}
      - YahooSync__DailySyncMinuteUtc=${YAHOO_SYNC_MINUTE_UTC:-45}
      - YahooSync__GameKey=${YAHOO_GAME_KEY:-}
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net


networks:
  leagueapi-net:
    driver: bridge
