version: '3.8'

services:
  leaguefrontend:
    build:
      context: ./src/LeagueFrontend
      dockerfile: Dockerfile
    ports:
      - "${LEAGUEFRONTEND_PORT:-3000}:80"
    environment:
      - API_BASE_URL=${FRONTEND_API_BASE_URL:-http://localhost:8082}
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # LeagueAPI - Player data aggregation service
  leagueapi:
    build:
      context: ./src/LeagueAPI
      dockerfile: Dockerfile
    ports:
      - "${LEAGUEAPI_PORT:-8082}:8082"
    environment:
      # Database connection
      - DBConnectionString=${DBConnectionString:?DBConnectionString required}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-agentdata}
      
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # Logging
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    
    networks:
      - leagueapi-net
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  fantasyprosdatasync:
    image: ghcr.io/ckriutz/fantasyprosdatasync:latest
    pull_policy: always
    environment:
      - FANTASY_PROS_API_KEY=${FANTASY_PROS_API_KEY:?FantasyPros API key required}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - FANTASYPROS_STORAGE_CONTAINER_NAME=${FANTASYPROS_STORAGE_CONTAINER_NAME:-fantasyprosdata}
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sportsdataiodatasync:
    image: ghcr.io/ckriutz/sportsdataiodatasync:latest
    pull_policy: always
    environment:
      - SPORTSDATA_API_KEY=${SPORTSDATA_API_KEY:?SportsData API key required}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - SPORTSDATA_STORAGE_CONTAINER_NAME=${SPORTSDATA_STORAGE_CONTAINER_NAME:-playerdata}
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sleepersync:
    image: ghcr.io/ckriutz/sleepersync:latest
    pull_policy: always
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - SLEEPER_STORAGE_CONTAINER_NAME=${SLEEPER_STORAGE_CONTAINER_NAME:-playerdata}
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  # YahooDataSync must remain single-replica because Yahoo rotates refresh tokens.
  yahoodatasync:
    image: ghcr.io/ckriutz/yahoodatasync:latest
    pull_policy: always
    ports:
      - "${YAHOODATASYNC_PORT:-8003}:8003"
    environment:
      - ASPNETCORE_URLS=http://+:8003
      - YAHOO_CLIENT_ID=${YAHOO_CLIENT_ID:-}
      - YAHOO_CLIENT_SECRET=${YAHOO_CLIENT_SECRET:-}
      - YahooClientId=${YahooClientId:-}
      - YahooClientSecret=${YahooClientSecret:-}
      - YAHOO_REDIRECT_URI=${YAHOO_REDIRECT_URI:-http://localhost:8003/api/yahoo/auth/callback}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - YAHOO_STORAGE_CONTAINER_NAME=${YAHOO_STORAGE_CONTAINER_NAME:-yahoodata}
      - YAHOO_OAUTH_STATE_BLOB_NAME=${YAHOO_OAUTH_STATE_BLOB_NAME:-yahoo/private/oauth-state.json}
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
      - YahooSync__Enabled=${YAHOO_SYNC_ENABLED:-true}
      - YahooSync__RunOnStartup=${YAHOO_SYNC_RUN_ON_STARTUP:-false}
      - YahooSync__PageSize=${YAHOO_SYNC_PAGE_SIZE:-25}
      - YahooSync__DailySyncHourUtc=${YAHOO_SYNC_HOUR_UTC:-6}
      - YahooSync__DailySyncMinuteUtc=${YAHOO_SYNC_MINUTE_UTC:-45}
      - YahooSync__GameKey=${YAHOO_GAME_KEY:-}
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

networks:
  leagueapi-net:
    driver: bridge
