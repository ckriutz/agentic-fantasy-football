services:
  leaguefrontend:
    image: ghcr.io/ckriutz/leaguefrontend:2
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${LEAGUEFRONTEND_PORT:-3080}:80"
    environment:
      # Runtime config written into /app-config.js by the container entrypoint.
      # VITE_* names are accepted as fallbacks, but these are the preferred vars.
      - API_BASE_URL=${API_BASE_URL:-http://192.168.40.159:8082}
      - BLOB_BASE_URL=${BLOB_BASE_URL:-https://kcfiles07.blob.core.windows.net}
      - BLOB_CONTAINER_NAME=${BLOB_CONTAINER_NAME:-agentdata}
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # LeagueAPI - Player data aggregation service
  leagueapi:
    image: ghcr.io/ckriutz/leagueapi:7
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${LEAGUEAPI_PORT:-8082}:8082"
    environment:
      # Database connection
      - DBConnectionString=
      - AZURE_STORAGE_CONNECTION_STRING=
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://192.168.40.159:3080
    networks:
      - leagueapi-net
    
    healthcheck:
      # Image has no curl/wget; bash /dev/tcp is available
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  fantasyprosdatasync:
    image: ghcr.io/ckriutz/fantasyprosdatasync:2
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${FANTASYPROSDATASYNC_PORT:-8004}:8004"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://192.168.40.159:3080
      - ASPNETCORE_URLS=http://+:8004
      - FANTASY_PROS_API_KEY=
      - AZURE_STORAGE_CONNECTION_STRING=
      - FANTASYPROS_STORAGE_CONTAINER_NAME=playerdata
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
      - FANTASYPROS_POINTS_SYNC_ENABLED=${FANTASYPROS_POINTS_SYNC_ENABLED:-true}
      - FANTASYPROS_POINTS_SYNC_INTERVAL_MINUTES=${FANTASYPROS_POINTS_SYNC_INTERVAL_MINUTES:-240}
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sportsdataiodatasync:
    image: ghcr.io/ckriutz/sportsdataiodatasync:1
    pull_policy: always
    restart: unless-stopped
    environment:
      - SPORTSDATA_API_KEY=
      - AZURE_STORAGE_CONNECTION_STRING=
      - SPORTSDATA_STORAGE_CONTAINER_NAME=playerdata
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sleepersync:
    image: ghcr.io/ckriutz/sleepersync:1
    pull_policy: always
    restart: unless-stopped
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=
      - SLEEPER_STORAGE_CONTAINER_NAME=playerdata
      - LEAGUE_API_BASE_URL=http://leagueapi:8082
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

networks:
  leagueapi-net:
    driver: bridge
