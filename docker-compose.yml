version: '3.8'

services:
  leaguefrontend:
    build:
      context: ./src/LeagueFrontend
      dockerfile: Dockerfile
    ports:
      - "${LEAGUEFRONTEND_PORT:-3000}:80"
    environment:
      - API_BASE_URL=${FRONTEND_API_BASE_URL:-http://localhost:8080}
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # LeagueAPI - Player data aggregation service
  leagueapi:
    build:
      context: ./src/LeagueAPI
      dockerfile: Dockerfile
    ports:
      - "${LEAGUEAPI_PORT:-8080}:8080"
    environment:
      # Database connection
      - DBConnectionString=${DBConnectionString:?DBConnectionString required}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-agentdata}
      
      # Yahoo Fantasy configuration
      - YahooClientId=${YahooClientId:?Yahoo OAuth client ID required}
      - YahooClientSecret=${YahooClientSecret:?Yahoo OAuth client secret required}
      - YAHOO_REDIRECT_URI=${YAHOO_REDIRECT_URI:-https://localhost:5001/api/yahoo/auth/callback}
      - YahooOAuth__AuthorizationUrl=https://api.login.yahoo.com/oauth2/request_auth
      - YahooOAuth__TokenUrl=https://api.login.yahoo.com/oauth2/get_token
      - YahooOAuth__FantasyApiBaseUrl=https://fantasysports.yahooapis.com/fantasy/v2
      - YahooOAuth__StateFilePath=/data/yahoo/auth-state.json
      
      # Yahoo sync configuration
      - YahooSync__Enabled=${YAHOO_SYNC_ENABLED:-true}
      - YahooSync__DefaultGameKey=461
      - YahooSync__DefaultSeason=2025
      - YahooSync__PageSize=25
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # Logging
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    
    volumes:
      # Persist data files (snapshots, state, auth tokens)
      - leagueapi-data:/data
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - leagueapi-net
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  fantasyprosdatasync:
    image: ghcr.io/ckriutz/fantasyprosdatasync:latest
    pull_policy: always
    environment:
      - FANTASY_PROS_API_KEY=${FANTASY_PROS_API_KEY:?FantasyPros API key required}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - FANTASYPROS_STORAGE_CONTAINER_NAME=${FANTASYPROS_STORAGE_CONTAINER_NAME:-fantasyprosdata}
      - LEAGUE_API_BASE_URL=http://leagueapi:8080
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sportsdataiodatasync:
    image: ghcr.io/ckriutz/sportsdataiodatasync:latest
    pull_policy: always
    environment:
      - SPORTSDATA_API_KEY=${SPORTSDATA_API_KEY:?SportsData API key required}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - SPORTSDATA_STORAGE_CONTAINER_NAME=${SPORTSDATA_STORAGE_CONTAINER_NAME:-playerdata}
      - LEAGUE_API_BASE_URL=http://leagueapi:8080
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  sleepersync:
    image: ghcr.io/ckriutz/sleepersync:latest
    pull_policy: always
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?Azure Storage connection string required}
      - SLEEPER_STORAGE_CONTAINER_NAME=${SLEEPER_STORAGE_CONTAINER_NAME:-playerdata}
      - LEAGUE_API_BASE_URL=http://leagueapi:8080
    depends_on:
      leagueapi:
        condition: service_healthy
    networks:
      - leagueapi-net

  # PostgreSQL database (optional but recommended)
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-leagueapi}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Postgres password required}
      - POSTGRES_HOST_AUTH_METHOD=md5
    
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    networks:
      - leagueapi-net
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leagueapi-data:
  postgres-data:

networks:
  leagueapi-net:
    driver: bridge
